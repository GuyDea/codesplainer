name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and test
        run: npm run check
      - run: npm run format:check
      - name: Build the CLI, the npm package, the desktop bundle and the Pages site
        run: |
          npm run build
          node scripts/pack-npm.mjs
          npm run build -w @codesplainer/desktop
          npm run build:pages
