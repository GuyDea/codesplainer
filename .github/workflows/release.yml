name: Release

# Push a tag like v0.2.0 (it must match the app version) to build the desktop app for macOS,
# Windows and Linux and attach the installers to a draft GitHub release; publish it by hand.
# "Run workflow" builds the installers without a release (kept as workflow artifacts).
# The npm package is published from a terminal: `npm run publish:npm` (see README).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json (v$version). Release with \`npm version <x.y.z>\`."
            exit 1
          fi
      - name: Every package is at the app version
        run: npm run version:check
      - run: npm ci
      - run: npm run check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner; builds both arm64 and x64 disk images.
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the installers
        run: npm run dist:desktop
        env:
          # Unsigned builds: don't look for signing certificates (macOS still gets an ad-hoc
          # signature, see packages/desktop/electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/desktop/release/Codesplainer-*.dmg
            packages/desktop/release/Codesplainer-*.exe
            packages/desktop/release/Codesplainer-*.AppImage
            packages/desktop/release/Codesplainer-*.deb
          if-no-files-found: error
          retention-days: 14
          # Installers are compressed already.
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Codesplainer $GITHUB_REF_NAME" \
            --generate-notes
