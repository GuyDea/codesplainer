<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Codesplainer · graph playground</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = q || localStorage.getItem('codesplainer.playground.theme') || 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/graph/dev/playground.tsx"></script>
  </body>
</html>
